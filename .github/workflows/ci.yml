name: CI

on:
  push:
    branches: [main, 'ci/**']
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt -- --check

  test:
    name: Clippy and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ALICE-FIX
    env:
      # the passed-test count at the commit that set it; fewer passed tests (a removed or skipped test,
      # or none at all) is a failure
      MIN_PASSED: "185"
    steps:
      - uses: actions/checkout@v5
        with:
          path: ALICE-FIX
          persist-credentials: false
      - name: Clone the siblings at the commits .github/alice-siblings pins
        run: |
          n=0
          while read -r repo sha; do
            case "$repo" in ''|'#'*) continue ;; esac
            git init -q "../$repo"
            git -C "../$repo" fetch -q --depth 1 "https://github.com/ext-sakamoro/$repo" "$sha"
            git -C "../$repo" checkout -q FETCH_HEAD
            n=$((n + 1))
          done < .github/alice-siblings
          if [ "$n" -eq 0 ]; then echo "::error::no sibling cloned"; exit 1; fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Clippy (all targets, -D warnings)
        run: cargo clippy --all-targets -- -D warnings
      - name: Passed tests are at least MIN_PASSED
        run: |
          set -o pipefail
          log="$(mktemp)"
          cargo test --all-targets 2>&1 | tee "$log"
          passed=$(grep -E '^test result: ' "$log" | awk '{s += $4} END {print s + 0}')
          echo "passed: ${passed} (minimum ${MIN_PASSED})"
          if [ "${passed}" -lt "${MIN_PASSED}" ]; then
            echo "::error::${passed} tests passed, fewer than ${MIN_PASSED}"
            exit 1
          fi

  actionlint:
    name: actionlint (workflow YAML 検証)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          fail_level: error
          reporter: github-check

