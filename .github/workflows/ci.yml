name: CI

on:
  push:
    branches: [main, 'ci/**']
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt -- --check

  test:
    name: Clippy and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ALICE-FIX
    env:
      # the passed-test count at the commit that set it; fewer passed tests (a removed or skipped test,
      # or none at all) is a failure
      MIN_PASSED: "185"
    steps:
      - uses: actions/checkout@v5
        with:
          path: ALICE-FIX
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Lock (every alice-* from git, none by path or from a registry, at most one alice-det-math)
        shell: bash
        run: |
          python3 - <<'PY'
          import sys, tomllib
          pk = [p for p in tomllib.load(open("Cargo.lock", "rb"))["package"] if p["name"].startswith("alice")]
          bad = [f'{p["name"]} {p["version"]} {p.get("source", "path")}' for p in pk
                 if p["name"] != "alice-fix" and not p.get("source", "").startswith("git+")]
          dm = [p for p in pk if p["name"] == "alice-det-math"]
          print(f"lock: {len(pk) - 1} alice-* dependencies, {len(bad)} not from git, {len(dm)} alice-det-math")
          if len(pk) < 2 or bad or len(dm) > 1:
              sys.exit("\n".join(bad) or "expected an alice-* dependency and at most one alice-det-math")
          PY
      - name: Clippy (all targets, -D warnings)
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Passed tests are at least MIN_PASSED
        run: |
          set -o pipefail
          log="$(mktemp)"
          cargo test --locked --all-targets 2>&1 | tee "$log"
          passed=$(grep -E '^test result: ' "$log" | awk '{s += $4} END {print s + 0}')
          echo "passed: ${passed} (minimum ${MIN_PASSED})"
          if [ "${passed}" -lt "${MIN_PASSED}" ]; then
            echo "::error::${passed} tests passed, fewer than ${MIN_PASSED}"
            exit 1
          fi

  actionlint:
    name: actionlint (workflow YAML 検証)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          fail_level: error
          reporter: github-check

